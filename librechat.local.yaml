version: 1.3.17
cache: true
interface:
  customWelcome: "Inspect synthetic data with DataCheck"
  privacyPolicy:
    externalUrl: ""
  endpointsMenu: true
  modelSelect: true
actions:
  # LibreChat omits the port from the domain saved by the action editor.
  allowedDomains: ['http://datacheck']
  allowedAddresses: ['datacheck:8000']
endpoints:
  agents:
    capabilities: [actions, tools]
